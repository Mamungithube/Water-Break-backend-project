

services:
  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: django_backend
    # command: daphne -b 0.0.0.0 -p 8000 water_break.asgi:application
    command: >
      sh -c "python manage.py migrate && 
             python -m daphne -b 0.0.0.0 -p 8001 water_break.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    env_file:
      - .env 
    environment:
      - PYTHONUNBUFFERED=1 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: celery_worker
    entrypoint: [""]
    command: celery -A water_break worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    container_name: celery_beat
    entrypoint: [""]
    command: celery -A water_break beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
